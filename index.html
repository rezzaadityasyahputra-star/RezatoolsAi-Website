<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RezHub - Admin Control Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- CORE CONFIG VARIANT BRANDING --- */
        :root {
            --bg-dark: #06060c;
            --bg-card: rgba(12, 12, 25, 0.7);
            --neon-cyan: #00f0ff;
            --neon-magenta: #ff007f;
            --neon-red: #ff3333;
            --border-glass: rgba(0, 240, 255, 0.15);
            --text-primary: #f5f7fa;
            --text-secondary: #90a0b5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: var(--bg-dark);
            color: var(--text-primary);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Ambient Space Background Effects */
        .ambient-glow {
            position: fixed;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255, 0, 127, 0.08) 0%, rgba(0,0,0,0) 70%);
            bottom: -10%;
            right: -5%;
            z-index: 1;
            pointer-events: none;
        }

        .glass {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
        }

        /* Layout Structure Controls */
        header {
            width: 100%;
            height: 75px;
            border-bottom: 1px solid var(--border-glass);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            background: rgba(6, 6, 12, 0.8);
            position: sticky;
            top: 0;
            z-index: 50;
        }
        .logo-area {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-shadow: 0 0 12px var(--neon-cyan);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo-area span { color: var(--neon-magenta); }

        .admin-container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 40px 20px;
            position: relative;
            z-index: 10;
            display: grid;
            grid-template-columns: 1fr;
            gap: 35px;
        }

        /* Statistics Cards Layout */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
        }
        .stat-card {
            padding: 25px 20px;
            display: flex;
            align-items: center;
            gap: 20px;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 5px 15px rgba(0, 240, 255, 0.1);
        }
        .stat-icon {
            width: 55px;
            height: 55px;
            border-radius: 12px;
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid rgba(0, 240, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            color: var(--neon-cyan);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
        }
        .stat-icon.magenta {
            background: rgba(255, 0, 127, 0.1);
            border-color: rgba(255, 0, 127, 0.3);
            color: var(--neon-magenta);
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.2);
        }
        .stat-meta h3 { font-size: 1.8rem; font-weight: 700; line-height: 1.2; }
        .stat-meta p { font-size: 0.85rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }

        /* Multi-Window Management Layout Control */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
        }

        @media (max-width: 992px) {
            .dashboard-grid { grid-template-columns: 1fr; }
        }

        /* Core Data Tables Modules Visual Customization */
        .panel-box {
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .panel-box h2 {
            font-size: 1.3rem;
            letter-spacing: 0.5px;
            border-left: 4px solid var(--neon-cyan);
            padding-left: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }
        th {
            background: rgba(255,255,255,0.03);
            padding: 15px 12px;
            color: var(--neon-cyan);
            font-weight: 600;
            border-bottom: 2px solid var(--border-glass);
        }
        td {
            padding: 15px 12px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            color: var(--text-primary);
        }
        tr:hover td {
            background: rgba(0, 240, 255, 0.02);
        }

        /* Dynamic Status Badges Components */
        .badge {
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .badge.online { background: rgba(0,255,127,0.1); color: #00ff7f; }
        .badge.offline { background: rgba(255,255,255,0.05); color: var(--text-secondary); }

        /* Form Controls Elements */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
        }
        .form-group label { font-size: 0.85rem; color: var(--text-secondary); font-weight: 500; }
        
        select, textarea {
            width: 100%;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 12px;
            color: #fff;
            outline: none;
            transition: all 0.3s;
        }
        select:focus, textarea:focus {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
            background: rgba(255,255,255,0.07);
        }
        select option { background: #0c0c19; color: #fff; }

        /* Button Action Controllers */
        .btn-core {
            position: relative;
            overflow: hidden;
            background: transparent;
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s ease;
            box-shadow: 0 0 8px rgba(0,240,255,0.15);
        }
        .btn-core:hover {
            background: var(--neon-cyan);
            color: #000;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
            transform: translateY(-2px);
        }
        .btn-action-icon {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 1px solid var(--neon-red);
            color: var(--neon-red);
            background: transparent;
            transition: all 0.3s;
        }
        .btn-action-icon:hover {
            background: var(--neon-red);
            color: #fff;
            box-shadow: 0 0 12px rgba(255,51,51,0.5);
            transform: scale(1.05);
        }

        /* Ripple Component Effect */
        .ripple-effect {
            position: absolute;
            background: rgba(255, 255, 255, 0.35);
            border-radius: 50%;
            transform: scale(0);
            animation: ripple-run 0.5s linear;
            pointer-events: none;
        }
        @keyframes ripple-run { to { transform: scale(4); opacity: 0; } }

        /* Global Dynamic Toast Alert Frames */
        .toast-box {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 15px 25px;
            z-index: 100;
            border-left: 4px solid var(--neon-cyan);
            transform: translateX(150%);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.9rem;
        }
        .toast-box.trigger { transform: translateX(0); }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>

    <header>
        <div class="logo-area"><i class="fa-solid fa-user-shield"></i> REZHUB <span>PANEL</span></div>
        <div class="badge online" style="padding: 6px 12px;"><i class="fa-solid fa-tower-cell"></i> Server Live</div>
    </header>

    <div class="admin-container">
        
        <div class="stats-row">
            <div class="stat-card glass">
                <div class="stat-icon"><i class="fa-solid fa-users"></i></div>
                <div class="stat-meta">
                    <h3 id="stat-total-users">0</h3>
                    <p>Total Pengguna</p>
                </div>
            </div>
            <div class="stat-card glass">
                <div class="stat-icon" style="color: #00ff7f; background:rgba(0,255,127,0.1); border-color: rgba(0,255,127,0.3); box-shadow: 0 0 10px rgba(0,255,127,0.2);">
                    <i class="fa-solid fa-signal"></i>
                </div>
                <div class="stat-meta">
                    <h3 id="stat-active-users">0</h3>
                    <p>User Aktif</p>
                </div>
            </div>
            <div class="stat-card glass">
                <div class="stat-icon magenta"><i class="fa-solid fa-chart-simple"></i></div>
                <div class="stat-meta">
                    <h3 id="stat-total-traffic">0</h3>
                    <p>Total Hit Kunjungan</p>
                </div>
            </div>
        </div>

        <div class="dashboard-grid">
            
            <div class="panel-box glass">
                <h2>Daftar Akun Pengguna <i class="fa-solid fa-folder-open" style="color:var(--neon-cyan)"></i></h2>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Nama Lengkap</th>
                                <th>Username</th>
                                <th>Jam Login</th>
                                <th>Status</th>
                                <th>Kunjungan</th>
                                <th style="text-align:center;">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="user-table-body">
                            </tbody>
                    </table>
                </div>
            </div>

            <div class="panel-box glass">
                <h2>Kirim Pesan Ke User <i class="fa-solid fa-paper-plane" style="color:var(--neon-magenta)"></i></h2>
                <form id="msg-dispatch-form" onsubmit="dispatchMessage(event)">
                    <div class="form-group">
                        <label for="target-selection">Pilih Target User</label>
                        <select id="target-selection" required>
                            <option value="" disabled selected>-- Pilih Pengguna --</option>
                            </select>
                    </div>
                    <div class="form-group">
                        <label for="msg-payload">Isi Pesan Custom</label>
                        <textarea id="msg-payload" rows="5" placeholder="Ketik pesan di sini..." required></textarea>
                    </div>
                    <button type="submit" class="btn-core" style="width: 100%; margin-top: 5px;">
                        <i class="fa-solid fa-share-nodes"></i> Kirim Pesan Realtime
                    </button>
                </form>
            </div>

        </div>
    </div>

    <div class="toast-box glass" id="admin-toast">
        <i class="fa-solid fa-circle-check" style="color: var(--neon-cyan); font-size:1.2rem;"></i>
        <span id="toast-txt-content">Aksi berhasil diproses!</span>
    </div>

    <script>
        let usersDB = JSON.parse(localStorage.getItem('usersDB')) || [];

        // Main Initialize Engine Routine
        window.addEventListener('DOMContentLoaded', () => {
            renderControlMetrics();
            attachRippleFxs();

            // Inter-tab cross database synchronization engine listeners 
            window.addEventListener('storage', (e) => {
                if (e.key === 'usersDB') {
                    usersDB = JSON.parse(e.newValue) || [];
                    renderControlMetrics();
                }
            });
        });

        // Event Ripple Generator Logic Attached
        function attachRippleFxs() {
            document.querySelectorAll('.btn-core').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    let rip = document.createElement('span');
                    rip.className = 'ripple-effect';
                    this.appendChild(rip);
                    let x = e.clientX - e.target.getBoundingClientRect().left;
                    let y = e.clientY - e.target.getBoundingClientRect().top;
                    rip.style.left = `${x}px`;
                    rip.style.top = `${y}px`;
                    setTimeout(() => { rip.remove(); }, 500);
                });
            });
        }

        // Custom Notification Automation Alerts Components
        function triggerToast(text) {
            const el = document.getElementById('admin-toast');
            document.getElementById('toast-txt-content').innerText = text;
            el.classList.add('trigger');
            setTimeout(() => { el.classList.remove('trigger'); }, 3000);
        }

        // Core UI Metrics Calculation Component
        function renderControlMetrics() {
            usersDB = JSON.parse(localStorage.getItem('usersDB')) || [];
            
            // Extract Statistical Elements Data Information
            const totalUsers = usersDB.length;
            const activeUsers = usersDB.filter(u => u.isOnline).length;
            const totalTraffic = usersDB.reduce((sum, u) => sum + (u.visits || 0), 0);

            document.getElementById('stat-total-users').innerText = totalUsers;
            document.getElementById('stat-active-users').innerText = activeUsers;
            document.getElementById('stat-total-traffic').innerText = totalTraffic;

            // Render Dynamic User Listing Logs Data Monitoring
            const tbody = document.getElementById('user-table-body');
            tbody.innerHTML = '';

            const selectEl = document.getElementById('target-selection');
            // Cache current selected options targeting parameters
            const currentSelected = selectEl.value;
            selectEl.innerHTML = '<option value="" disabled selected>-- Pilih Pengguna --</option>';

            if (usersDB.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:var(--text-secondary);">Tidak ada data akun pengguna terdaftar.</td></tr>`;
                return;
            }

            usersDB.forEach(user => {
                // Populate Table View Row Data Elements
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><strong>${user.fullName}</strong></td>
                    <td>@${user.username}</td>
                    <td><i class="fa-regular fa-clock" style="color:var(--neon-cyan); margin-right:5px;"></i> ${user.loginTime || '-'}</td>
                    <td>
                        <span class="badge ${user.isOnline ? 'online' : 'offline'}">
                            <i class="fa-solid fa-circle" style="font-size:0.5rem"></i> ${user.isOnline ? 'Online' : 'Offline'}
                        </span>
                    </td>
                    <td><i class="fa-solid fa-chart-line" style="color:var(--text-secondary)"></i> ${user.visits || 0} x</td>
                    <td style="text-align:center;">
                        <button class="btn-action-icon" onclick="deleteUserAccount('${user.username}')" title="Hapus Akun">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(row);

                // Populate Communications Selection Options Array List
                const option = document.createElement('option');
                option.value = user.username;
                option.innerText = `${user.fullName} (@${user.username})`;
                selectEl.appendChild(option);
            });

            // Re-apply select choices memory positions indicators
            if (currentSelected && usersDB.some(u => u.username === currentSelected)) {
                selectEl.value = currentSelected;
            }
        }

        // Live Operational Database Mutations Module - Delete Accounts
        function deleteUserAccount(username) {
            if (confirm(`Apakah Anda yakin ingin menghapus akun @${username} secara permanen?`)) {
                usersDB = JSON.parse(localStorage.getItem('usersDB')) || [];
                usersDB = usersDB.filter(u => u.username !== username);
                localStorage.setItem('usersDB', JSON.stringify(usersDB));
                
                triggerToast(`Akun @${username} berhasil dihapus dari sistem!`);
                renderControlMetrics();
            }
        }

        // Live Synchronous Data Messages Broadcasting Module Dispatcher Engine
        function dispatchMessage(e) {
            e.preventDefault();
            const targetUser = document.getElementById('target-selection').value;
            const message = document.getElementById('msg-payload').value.trim();

            if (!targetUser) return alert("Pilih target user terlebih dahulu!");

            const payloadSync = {
                targetUser: targetUser,
                message: message,
                timestamp: Date.now(),
                timeStr: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })
            };

            // Flash transmit execution sequence over localStorage pipe network
            localStorage.setItem('adminMessageSync', JSON.stringify(payloadSync));
            
            triggerToast(`Pesan berhasil dikirim secara realtime ke @${targetUser}!`);
            document.getElementById('msg-payload').value = '';
        }
    </script>
</body>
</html>
